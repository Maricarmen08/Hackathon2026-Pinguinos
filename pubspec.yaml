name: hackathon_pinguinos_mvp
description: Asistente de IA por voz e imagen para pequenos negocios informales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  printing: 5.14.2
  record: 6.1.2
  image_picker: 1.2.0
  # Java-based plugin compatible with the project's existing AGP/Kotlin flags.
  google_mlkit_text_recognition: 0.15.1
  crypto: 3.0.7
  path_provider: 2.1.6
  google_sign_in: 7.2.0
  google_sign_in_android: 7.2.18
  google_sign_in_platform_interface: 3.1.0
  google_sign_in_web: 1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

