name: hackathon_pinguinos_mvp
description: Asistente de IA por voz e imagen para pequenos negocios informales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  printing: 5.14.2
  record: 6.1.2
  image_picker: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

