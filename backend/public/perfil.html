<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - Khipu IA</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="phone-device">
    <div class="app-viewport">
      <div class="status-bar">
        <span>9:41</span>
        <div class="notch-pill"></div>
        <div class="status-right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2v-10h-2v10zm4 0h2V6h-2v14zm4 0h2V2h-2v18z"/></svg>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M21 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="toast-alert" id="toastBox">
        <span id="toastText"></span>
      </div>

      <div class="top-bar">
        <div class="profile-chip">
          <div class="avatar-badge" id="headerAvatar">RQ</div>
          <div>
            <div class="top-sub" id="headerOwnerName">Hola, Rosa Quispe</div>
            <div class="top-title" id="headerBizName">Bodega Doña Rosa</div>
          </div>
        </div>
      </div>

      <div class="page-scroll">
        <div class="clean-card">
          <div class="clean-card-title">Información del Negocio</div>
          <form onsubmit="updateProfile(event)">
            <div class="form-field">
              <label>NOMBRE DEL NEGOCIO</label>
              <div class="input-box">
                <input type="text" id="nombre_negocio" required />
              </div>
            </div>

            <div class="form-field">
              <label>TITULAR</label>
              <div class="input-box">
                <input type="text" id="propietario" required />
              </div>
            </div>

            <div class="form-field">
              <label>DOCUMENTO (DNI / RUC)</label>
              <div class="input-box">
                <input type="text" id="documento_identidad" />
              </div>
            </div>

            <div class="form-field">
              <label>TELÉFONO</label>
              <div class="input-box">
                <input type="text" id="telefono" required />
              </div>
            </div>

            <div class="form-field">
              <label>RUBRO</label>
              <div class="input-box">
                <input type="text" id="rubro" required />
              </div>
            </div>

            <button type="submit" class="btn-green">
              <span>Guardar Cambios</span>
            </button>
          </form>
        </div>

        <button onclick="logout()" style="width: 100%; padding: 14px; border-radius: 16px; border: 1.5px solid #FECACA; background: #FEF2F2; color: #EF4444; font-weight: 700; font-size: 14px; cursor: pointer;">
          Cerrar Sesión
        </button>
      </div>

      <nav class="bottom-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Caja</span>
        </a>
        <a href="/reportes.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
          <span>Flujo</span>
        </a>
        <a href="/credito.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Crédito</span>
        </a>
        <a href="/perfil.html" class="nav-link active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function initProfile() {
      const biz = await fetchHeaderBusiness();
      if (biz) {
        document.getElementById('nombre_negocio').value = biz.nombre_negocio || '';
        document.getElementById('propietario').value = biz.propietario || '';
        document.getElementById('documento_identidad').value = biz.documento_identidad || '';
        document.getElementById('telefono').value = biz.telefono || '';
        document.getElementById('rubro').value = biz.rubro || '';
      }
    }

    async function updateProfile(e) {
      e.preventDefault();
      const id = getActiveBusinessId();
      const payload = {
        nombre_negocio: document.getElementById('nombre_negocio').value.trim(),
        propietario: document.getElementById('propietario').value.trim(),
        documento_identidad: document.getElementById('documento_identidad').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        rubro: document.getElementById('rubro').value.trim()
      };

      await fetch(`/api/negocio/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      await fetchHeaderBusiness();
      showToast('Datos actualizados');
    }

    function logout() {
      localStorage.removeItem('khipu_negocio_id');
      window.location.href = '/login.html';
    }

    initProfile();
  </script>
</body>
</html>
