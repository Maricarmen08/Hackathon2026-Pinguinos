<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crédito - Khipu IA</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="phone-device">
    <div class="app-viewport">
      <div class="status-bar">
        <span>9:41</span>
        <div class="notch-pill"></div>
        <div class="status-right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2v-10h-2v10zm4 0h2V6h-2v14zm4 0h2V2h-2v18z"/></svg>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M21 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="toast-alert" id="toastBox">
        <span id="toastText"></span>
      </div>

      <div class="top-bar">
        <a href="/perfil.html" class="profile-chip">
          <div class="avatar-badge" id="headerAvatar">RQ</div>
          <div>
            <div class="top-sub" id="headerOwnerName">Hola, Rosa Quispe</div>
            <div class="top-title" id="headerBizName">Bodega Doña Rosa</div>
          </div>
        </a>
      </div>

      <div class="page-scroll">
        <div class="clean-card" style="text-align: center;">
          <div style="font-size: 12px; font-weight: 700; color: #059669; margin-bottom: 4px;">PUNTAJE FINANCIERO</div>
          <div style="font-size: 38px; font-weight: 800; color: #064E3B;" id="scoreVal">82 / 100</div>
          <p style="font-size: 12.5px; color: #64748B; margin: 6px 0 18px;">
            Línea pre-aprobada hasta <strong>S/ 2,500.00</strong>
          </p>

          <form onsubmit="requestLoan(event)" style="text-align: left;">
            <div class="form-field">
              <label>ENTIDAD FINANCIERA</label>
              <div class="input-box">
                <select id="entidad">
                  <option value="Caja Municipal Huancayo">Caja Municipal Huancayo</option>
                  <option value="Caja Arequipa">Caja Arequipa</option>
                  <option value="Mibanco">Mibanco</option>
                </select>
              </div>
            </div>

            <div class="form-field">
              <label>MONTO A SOLICITAR (S/)</label>
              <div class="input-box">
                <input type="number" id="montoCredito" value="2500" min="500" max="10000" required />
              </div>
            </div>

            <button type="submit" class="btn-green">
              <span>Solicitar Microcrédito</span>
            </button>
          </form>
        </div>

        <div class="clean-card">
          <div class="clean-card-title">Mis Solicitudes</div>
          <div id="creditList"></div>
        </div>

        <div class="clean-card">
          <div class="clean-card-title">Invitar Comerciante (+15 pts)</div>
          <form onsubmit="addReferral(event)">
            <div class="form-field">
              <div class="input-box">
                <input type="text" id="refName" placeholder="Nombre del negocio o amigo" required />
              </div>
            </div>
            <div class="form-field">
              <div class="input-box">
                <input type="text" id="refPhone" placeholder="Teléfono celular" required />
              </div>
            </div>
            <button type="submit" class="btn-outline">
              <span>Registrar Invitado</span>
            </button>
          </form>
          <div id="referralList" style="margin-top: 12px;"></div>
        </div>
      </div>

      <nav class="bottom-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Caja</span>
        </a>
        <a href="/reportes.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
          <span>Flujo</span>
        </a>
        <a href="/credito.html" class="nav-link active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Crédito</span>
        </a>
        <a href="/perfil.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    let currentScore = 82;

    async function loadCreditPage() {
      const biz = await fetchHeaderBusiness();
      if (biz && biz.score_crediticio) {
        currentScore = biz.score_crediticio;
        document.getElementById('scoreVal').textContent = `${currentScore} / 100`;
      }

      const id = getActiveBusinessId();
      const cRes = await fetch(`/api/creditos?negocio_id=${id}`);
      const credits = await cRes.json();
      const cBox = document.getElementById('creditList');
      cBox.innerHTML = '';
      credits.forEach(c => {
        const div = document.createElement('div');
        div.className = 'tx-card';
        div.innerHTML = `
          <div>
            <div class="tx-title">${c.entidad_financiera}</div>
            <div class="tx-cat">${c.estado.replace('_', ' ')} • ${c.plazo_meses} meses</div>
          </div>
          <div class="tx-amount in">S/ ${Number(c.monto_solicitado).toFixed(2)}</div>
        `;
        cBox.appendChild(div);
      });

      const rRes = await fetch(`/api/referidos?negocio_id=${id}`);
      const refs = await rRes.json();
      const rBox = document.getElementById('referralList');
      rBox.innerHTML = '';
      refs.forEach(r => {
        const div = document.createElement('div');
        div.className = 'tx-card';
        div.innerHTML = `
          <div>
            <div class="tx-title">${r.nombre_comerciante}</div>
            <div class="tx-cat">${r.telefono_comerciante}</div>
          </div>
          <div class="tx-amount in">+${r.puntos_ganados} pts</div>
        `;
        rBox.appendChild(div);
      });
    }

    async function requestLoan(e) {
      e.preventDefault();
      const monto = Number(document.getElementById('montoCredito').value);
      const entidad = document.getElementById('entidad').value;
      const cuota = Math.round((monto * 1.08) / 6);

      await fetch('/api/creditos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          negocio_id: getActiveBusinessId(),
          entidad_financiera: entidad,
          monto_solicitado: monto,
          plazo_meses: 6,
          cuota_mensual: cuota,
          score_actual: currentScore
        })
      });

      showToast('Solicitud registrada');
      await loadCreditPage();
    }

    async function addReferral(e) {
      e.preventDefault();
      const nombre_comerciante = document.getElementById('refName').value.trim();
      const telefono_comerciante = document.getElementById('refPhone').value.trim();

      await fetch('/api/referidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          negocio_id: getActiveBusinessId(),
          nombre_comerciante,
          telefono_comerciante
        })
      });

      document.getElementById('refName').value = '';
      document.getElementById('refPhone').value = '';
      showToast('Invitado registrado (+15 pts)');
      await loadCreditPage();
    }

    loadCreditPage();
  </script>
</body>
</html>
