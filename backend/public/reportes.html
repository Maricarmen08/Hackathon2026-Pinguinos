<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flujo de Caja - Khipu IA</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="phone-device">
    <div class="app-viewport">
      <div class="status-bar">
        <span>9:41</span>
        <div class="notch-pill"></div>
        <div class="status-right">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2v-10h-2v10zm4 0h2V6h-2v14zm4 0h2V2h-2v18z"/></svg>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M21 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <div class="top-bar">
        <a href="/perfil.html" class="profile-chip">
          <div class="avatar-badge" id="headerAvatar">RQ</div>
          <div>
            <div class="top-sub" id="headerOwnerName">Hola, Rosa Quispe</div>
            <div class="top-title" id="headerBizName">Bodega Doña Rosa</div>
          </div>
        </a>
      </div>

      <div class="page-scroll">
        <div class="clean-card">
          <div class="clean-card-title">Resumen del Mes</div>
          <div class="progress-item">
            <div class="progress-head">
              <span>Ingresos por Ventas</span>
              <span style="color: #059669;" id="repIn">S/ 0.00</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="barIn" style="width: 70%;"></div>
            </div>
          </div>

          <div class="progress-item" style="margin-bottom: 0;">
            <div class="progress-head">
              <span>Compras y Proveedores</span>
              <span style="color: #EF4444;" id="repOut">S/ 0.00</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="barOut" style="width: 35%; background: #EF4444;"></div>
            </div>
          </div>
        </div>

        <div class="clean-card">
          <div class="clean-card-title">Ventas por Categoría</div>
          <div id="categoryBreakdown"></div>
        </div>

        <div class="clean-card" style="background: #ECFDF5; border-color: #A7F3D0;">
          <div class="clean-card-title" style="margin-bottom: 6px;">Análisis del Asistente</div>
          <p style="font-size: 13px; color: #064E3B; line-height: 1.55;" id="aiSummaryText">
            Tus ingresos superan tus gastos operativos, manteniendo liquidez positiva para acceder a crédito formal.
          </p>
        </div>
      </div>

      <nav class="bottom-nav">
        <a href="/dashboard.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Caja</span>
        </a>
        <a href="/reportes.html" class="nav-link active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
          <span>Flujo</span>
        </a>
        <a href="/credito.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Crédito</span>
        </a>
        <a href="/perfil.html" class="nav-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Perfil</span>
        </a>
      </nav>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function initReports() {
      await fetchHeaderBusiness();
      const id = getActiveBusinessId();
      const res = await fetch(`/api/transacciones?negocio_id=${id}`);
      const list = await res.json();

      let totalIn = 0;
      let totalOut = 0;
      const byCat = {};

      list.forEach(t => {
        const m = Number(t.monto || 0);
        if (t.tipo === 'INGRESO') totalIn += m;
        else totalOut += m;
        byCat[t.categoria] = (byCat[t.categoria] || 0) + m;
      });

      const sumTotal = Math.max(1, totalIn + totalOut);
      document.getElementById('repIn').textContent = `S/ ${totalIn.toFixed(2)}`;
      document.getElementById('repOut').textContent = `S/ ${totalOut.toFixed(2)}`;
      document.getElementById('barIn').style.width = `${Math.round((totalIn / sumTotal) * 100)}%`;
      document.getElementById('barOut').style.width = `${Math.round((totalOut / sumTotal) * 100)}%`;

      const catBox = document.getElementById('categoryBreakdown');
      catBox.innerHTML = '';
      Object.entries(byCat).forEach(([cat, val]) => {
        const pct = Math.min(100, Math.round((val / sumTotal) * 100));
        const div = document.createElement('div');
        div.className = 'progress-item';
        div.innerHTML = `
          <div class="progress-head">
            <span>${cat}</span>
            <span>S/ ${val.toFixed(2)}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${pct}%;"></div>
          </div>
        `;
        catBox.appendChild(div);
      });
    }

    initReports();
  </script>
</body>
</html>
